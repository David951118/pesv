# =============================================================================
# Data Classification Policy — AION Defensa Predictiva S.A.S
# =============================================================================
# Defines four classification levels for all data handled by the system.
# Each level specifies a description, examples, allowed actions, storage
# requirements, and access controls. All personnel and automated systems
# must respect these classifications.
# =============================================================================

policy:
  name: Data Classification Policy
  version: "1.0.0"
  effective_date: "2025-01-01"
  review_cycle: quarterly
  owner: Security Team
  scope: >
    All data processed, stored, or transmitted by the AION Defensa Predictiva
    desktop installer and associated backend services.

# ---------------------------------------------------------------------------
# Classification Levels (ascending sensitivity)
# ---------------------------------------------------------------------------
levels:
  - id: PUBLIC
    label: Public
    color: "#22c55e"  # green
    description: >
      Information intended for public disclosure. No business impact if
      exposed. Includes marketing material, public documentation, and
      open-source code.
    examples:
      - Public-facing documentation
      - Open-source repository contents
      - Published release notes
      - Marketing materials
    allowed_actions:
      - read
      - copy
      - share_external
      - print
      - export
      - index
    storage:
      encryption_at_rest: optional
      encryption_in_transit: required
    access_control:
      min_role: Viewer
      mfa_required: false
    retention:
      default_days: 365
      max_days: unlimited

  - id: INTERNAL
    label: Internal
    color: "#3b82f6"  # blue
    description: >
      Information meant for internal use within the organization. Low
      business impact if exposed. Includes internal memos, non-sensitive
      operational data, and aggregated statistics.
    examples:
      - Internal reports and dashboards
      - Aggregated fleet statistics
      - Non-sensitive operational logs
      - Internal communications
      - Vehicle make/model/year data
    allowed_actions:
      - read
      - copy
      - share_internal
      - print
      - export_internal
    prohibited_actions:
      - share_external
    storage:
      encryption_at_rest: required
      encryption_in_transit: required
    access_control:
      min_role: Operator
      mfa_required: false
    retention:
      default_days: 730
      max_days: 1825

  - id: CONFIDENTIAL
    label: Confidential
    color: "#f59e0b"  # amber
    description: >
      Sensitive business information whose exposure could cause significant
      harm. Includes personal data (PII), financial records, GPS tracking
      data, and contract details.
    examples:
      - Conductor personal information (cedulas, phone numbers)
      - Vehicle license plates and registration numbers
      - GPS tracking data and route history
      - FUEC document contents
      - Pre-operational inspection details
      - Financial and billing records
      - NIT (tax identification) numbers
      - Email addresses and contact details
    allowed_actions:
      - read
      - copy_with_audit
      - share_internal_encrypted
    prohibited_actions:
      - share_external
      - print_without_approval
      - export_unencrypted
      - index_external
    storage:
      encryption_at_rest: required
      encryption_algorithm: AES-256-GCM
      encryption_in_transit: required
      backup_encryption: required
    access_control:
      min_role: Operator
      mfa_required: true
      audit_logging: required
    retention:
      default_days: 1095
      max_days: 2555
    handling:
      - Must be encrypted when shared
      - Access logged and auditable
      - Deletion requires supervisor approval

  - id: RESTRICTED
    label: Restricted
    color: "#ef4444"  # red
    description: >
      Highly sensitive information whose exposure could cause severe
      damage. Includes authentication credentials, API keys, signing
      certificates, encryption keys, and bank account details.
    examples:
      - API keys and secrets (Supabase, GitHub, Google Drive, OpenAI, Claude)
      - Signing certificates (Apple, Windows)
      - Tauri signing private keys
      - Database credentials and connection strings
      - JWT tokens and refresh tokens
      - OAuth client secrets
      - Bank account numbers and financial credentials
      - Encryption master keys
      - Keychain/DPAPI-protected secrets
    allowed_actions:
      - read_with_audit
    prohibited_actions:
      - copy
      - share_external
      - share_internal_unencrypted
      - print
      - export
      - cache_unencrypted
      - log_plaintext
    storage:
      encryption_at_rest: required
      encryption_algorithm: AES-256-GCM
      encryption_in_transit: required
      key_management: hardware_backed_preferred
      backup_encryption: required
      secure_deletion: required
    access_control:
      min_role: Admin
      mfa_required: true
      audit_logging: required
      access_review_cycle: monthly
      break_glass_procedure: required
    retention:
      default_days: 365
      max_days: 730
      rotation_required: true
      rotation_cycle_days: 90
    handling:
      - Never log in plaintext
      - Store only in OS keychain or encrypted vault
      - Rotate on suspected compromise
      - Access requires explicit justification
      - All access triggers real-time alert

# ---------------------------------------------------------------------------
# Enforcement
# ---------------------------------------------------------------------------
enforcement:
  default_classification: INTERNAL
  classification_required_before_storage: true
  reclassification:
    allowed: true
    requires_approval_from: Admin
    audit_trail: required
  violations:
    first_offense: warning_and_retraining
    second_offense: access_suspension
    critical_violation: immediate_access_revocation
