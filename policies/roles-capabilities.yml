# =============================================================================
# Roles & Capabilities Policy — AION Defensa Predictiva S.A.S
# =============================================================================
# Defines the role hierarchy, capabilities, and restrictions for all users
# of the desktop installer and associated services. Follows the principle
# of least privilege.
# =============================================================================

policy:
  name: Roles and Capabilities
  version: "1.0.0"
  effective_date: "2025-01-01"
  review_cycle: quarterly
  owner: Security Team
  principles:
    - Least privilege by default
    - Deny unless explicitly allowed
    - All elevated actions require audit logging
    - Role assignment requires Admin approval

# ---------------------------------------------------------------------------
# Role Definitions
# ---------------------------------------------------------------------------
roles:
  # -------------------------------------------------------------------------
  # Admin — Full system access, fleet management, user management
  # -------------------------------------------------------------------------
  - id: admin
    label: Admin
    description: >
      Full system administrator with access to all features, user
      management, configuration, and audit logs. Responsible for fleet
      operations, compliance, and security oversight.
    max_session_duration_hours: 8
    mfa_required: true
    ip_restriction: none
    max_concurrent_sessions: 3
    capabilities:
      # User management
      - user.create
      - user.read
      - user.update
      - user.delete
      - user.assign_role
      - user.reset_password
      - user.suspend
      - user.view_audit_log

      # Vehicle management
      - vehicle.create
      - vehicle.read
      - vehicle.update
      - vehicle.delete
      - vehicle.assign_conductor
      - vehicle.view_gps
      - vehicle.view_history
      - vehicle.export

      # Conductor management
      - conductor.create
      - conductor.read
      - conductor.update
      - conductor.delete
      - conductor.view_documents
      - conductor.assign_vehicle
      - conductor.export

      # Pre-operational inspections
      - preoperativa.create
      - preoperativa.read
      - preoperativa.update
      - preoperativa.approve
      - preoperativa.reject
      - preoperativa.export
      - preoperativa.delete

      # FUEC documents
      - fuec.create
      - fuec.read
      - fuec.update
      - fuec.void
      - fuec.export
      - fuec.print

      # RNDC registry
      - rndc.submit
      - rndc.read
      - rndc.update
      - rndc.cancel

      # GPS tracking
      - gps.view_realtime
      - gps.view_history
      - gps.configure_alerts
      - gps.export_data

      # Documents
      - document.upload
      - document.read
      - document.delete
      - document.export

      # Reports & analytics
      - report.generate
      - report.read
      - report.export
      - report.schedule

      # System configuration
      - config.read
      - config.update
      - config.backup
      - config.restore

      # Audit
      - audit.read
      - audit.export

      # Desktop installer specific
      - installer.configure_updates
      - installer.manage_certificates
      - installer.view_diagnostics
      - installer.manage_integrations

    restrictions:
      - Cannot delete own admin account
      - Cannot modify own role
      - Bulk delete operations require confirmation
      - Configuration changes are audit-logged

  # -------------------------------------------------------------------------
  # Operator — Day-to-day fleet operations, read-write on operational data
  # -------------------------------------------------------------------------
  - id: operator
    label: Operator
    description: >
      Operational staff responsible for daily fleet management tasks.
      Can manage vehicles, conductors, and inspections but cannot
      modify system configuration or manage user accounts.
    max_session_duration_hours: 10
    mfa_required: true
    ip_restriction: none
    max_concurrent_sessions: 2
    capabilities:
      # Vehicle management (no delete)
      - vehicle.create
      - vehicle.read
      - vehicle.update
      - vehicle.assign_conductor
      - vehicle.view_gps
      - vehicle.view_history

      # Conductor management (no delete)
      - conductor.create
      - conductor.read
      - conductor.update
      - conductor.view_documents
      - conductor.assign_vehicle

      # Pre-operational inspections
      - preoperativa.create
      - preoperativa.read
      - preoperativa.update
      - preoperativa.approve
      - preoperativa.reject

      # FUEC documents
      - fuec.create
      - fuec.read
      - fuec.update
      - fuec.print

      # RNDC registry
      - rndc.submit
      - rndc.read
      - rndc.update

      # GPS tracking
      - gps.view_realtime
      - gps.view_history

      # Documents
      - document.upload
      - document.read

      # Reports (read only, no export)
      - report.read

    restrictions:
      - Cannot delete vehicles or conductors
      - Cannot manage users or roles
      - Cannot modify system configuration
      - Cannot export bulk data
      - Cannot access audit logs
      - Cannot void FUEC documents

  # -------------------------------------------------------------------------
  # Viewer — Read-only access to operational data
  # -------------------------------------------------------------------------
  - id: viewer
    label: Viewer
    description: >
      Read-only access to operational data. Suitable for auditors,
      compliance reviewers, or stakeholders who need visibility but
      should not modify any data.
    max_session_duration_hours: 8
    mfa_required: false
    ip_restriction: none
    max_concurrent_sessions: 2
    capabilities:
      # Read-only on all operational data
      - vehicle.read
      - vehicle.view_gps
      - vehicle.view_history
      - conductor.read
      - conductor.view_documents
      - preoperativa.read
      - fuec.read
      - rndc.read
      - gps.view_realtime
      - gps.view_history
      - document.read
      - report.read

    restrictions:
      - No create, update, or delete on any resource
      - Cannot export data
      - Cannot print FUEC documents
      - Cannot access system configuration
      - Cannot access audit logs
      - Cannot assign vehicles or conductors

  # -------------------------------------------------------------------------
  # Conductor — Mobile/field user with limited self-service access
  # -------------------------------------------------------------------------
  - id: conductor
    label: Conductor
    description: >
      Driver/conductor role for field operations. Can view their own
      assigned vehicles, submit pre-operational inspections, and view
      their own FUEC documents. Cannot access other conductors' data.
    max_session_duration_hours: 12
    mfa_required: false
    ip_restriction: none
    max_concurrent_sessions: 1
    capabilities:
      # Self-service vehicle info (own assignments only)
      - vehicle.read.own
      - vehicle.view_gps.own

      # Self-service conductor profile
      - conductor.read.own
      - conductor.update.own_profile
      - conductor.view_documents.own

      # Pre-operational inspections (submit for own vehicle)
      - preoperativa.create.own
      - preoperativa.read.own

      # FUEC documents (view own)
      - fuec.read.own

      # Documents (upload own, e.g. license renewal)
      - document.upload.own
      - document.read.own

    restrictions:
      - Can only access own data (enforced by RLS policies)
      - Cannot view other conductors' data
      - Cannot access admin or operational features
      - Cannot export any data
      - Cannot approve/reject inspections
      - Cannot access GPS history of other vehicles
      - Cannot void or create FUEC documents
      - Single concurrent session only

# ---------------------------------------------------------------------------
# Role Hierarchy
# ---------------------------------------------------------------------------
hierarchy:
  - admin          # Inherits all capabilities
  - operator       # Inherits viewer capabilities
  - viewer         # Base read-only
  - conductor      # Isolated self-service (does NOT inherit viewer)

# ---------------------------------------------------------------------------
# Capability Inheritance Rules
# ---------------------------------------------------------------------------
inheritance:
  admin:
    inherits_from: [operator]
    additional: true
  operator:
    inherits_from: [viewer]
    additional: true
  viewer:
    inherits_from: []
    additional: false
  conductor:
    inherits_from: []
    additional: false
    note: "Conductor capabilities are isolated; no inheritance from viewer"

# ---------------------------------------------------------------------------
# Role Assignment Rules
# ---------------------------------------------------------------------------
assignment:
  default_role: viewer
  role_change_requires:
    viewer_to_operator: admin_approval
    operator_to_admin: admin_approval_and_mfa_enrollment
    any_to_conductor: admin_approval
    any_demotion: admin_approval
  audit_trail: required
  notification:
    on_role_change: [user, admin]
    on_new_assignment: [user, admin]
