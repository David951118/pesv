# =============================================================================
# Data Retention Defaults — AION Defensa Predictiva S.A.S
# =============================================================================
# Defines default retention periods per data classification level,
# legal hold policies, backup schedules, and secure deletion procedures.
# Compliant with Colombian data protection law (Ley 1581 de 2012) and
# transportation regulatory requirements.
# =============================================================================

policy:
  name: Data Retention Defaults
  version: "1.0.0"
  effective_date: "2025-01-01"
  review_cycle: semi-annual
  owner: Security Team
  legal_basis:
    - "Ley 1581 de 2012 (Colombian Data Protection)"
    - "Decreto 1377 de 2013 (Data Protection Regulations)"
    - "Resolucion 315 de 2013 (Transportation Ministry — RNDC)"
    - "Resolucion 1552 de 2014 (FUEC Requirements)"

# ---------------------------------------------------------------------------
# Retention Periods by Classification Level
# ---------------------------------------------------------------------------
retention_by_classification:
  PUBLIC:
    default_retention_days: 365
    max_retention_days: null  # unlimited
    auto_delete: false
    review_before_delete: false
    description: >
      Public data has no mandatory retention limit. Retained for at
      least one year for reference, then subject to periodic cleanup.

  INTERNAL:
    default_retention_days: 730       # 2 years
    max_retention_days: 1825          # 5 years
    auto_delete: true
    review_before_delete: true
    reviewer_role: operator
    description: >
      Internal data retained for two years by default. Operational
      reports and aggregated statistics may be kept up to five years
      for trend analysis.

  CONFIDENTIAL:
    default_retention_days: 1095      # 3 years
    max_retention_days: 2555          # 7 years
    auto_delete: false
    review_before_delete: true
    reviewer_role: admin
    secure_deletion_required: true
    description: >
      Confidential data including PII is retained for three years by
      default. Transportation records (FUEC, inspections) may be
      retained up to seven years for regulatory compliance.

  RESTRICTED:
    default_retention_days: 365       # 1 year
    max_retention_days: 730           # 2 years
    auto_delete: false
    review_before_delete: true
    reviewer_role: admin
    secure_deletion_required: true
    rotation_required: true
    rotation_cycle_days: 90
    description: >
      Restricted data (credentials, keys) has the shortest retention.
      Must be rotated every 90 days. Old credentials securely deleted
      within 30 days of rotation.

# ---------------------------------------------------------------------------
# Retention Periods by Data Type (overrides classification defaults)
# ---------------------------------------------------------------------------
retention_by_data_type:
  # Transportation regulatory records
  fuec_documents:
    classification: CONFIDENTIAL
    retention_days: 1825              # 5 years (regulatory requirement)
    regulatory_basis: "Resolucion 1552 de 2014"
    auto_delete: false
    description: "FUEC documents must be retained for 5 years per regulation"

  preoperational_inspections:
    classification: CONFIDENTIAL
    retention_days: 1095              # 3 years
    regulatory_basis: "Resolucion 315 de 2013"
    auto_delete: false
    description: "Pre-operational inspections retained for 3 years"

  rndc_submissions:
    classification: CONFIDENTIAL
    retention_days: 1825              # 5 years
    regulatory_basis: "Resolucion 315 de 2013"
    auto_delete: false
    description: "RNDC submissions retained for 5 years per regulation"

  # GPS and tracking data
  gps_events:
    classification: CONFIDENTIAL
    retention_days: 365               # 1 year
    auto_delete: true
    review_before_delete: false
    description: "GPS events retained for 1 year, then auto-purged"

  gps_route_history:
    classification: CONFIDENTIAL
    retention_days: 180               # 6 months
    auto_delete: true
    review_before_delete: false
    description: "Route history retained for 6 months"

  # User and personnel data
  conductor_records:
    classification: CONFIDENTIAL
    retention_days: 1825              # 5 years after deactivation
    starts_from: deactivation_date
    auto_delete: false
    secure_deletion_required: true
    description: "Conductor records retained 5 years after account deactivation"

  user_accounts:
    classification: CONFIDENTIAL
    retention_days: 1095              # 3 years after deactivation
    starts_from: deactivation_date
    auto_delete: false
    secure_deletion_required: true
    description: "User accounts retained 3 years after deactivation"

  # Authentication and security
  auth_tokens:
    classification: RESTRICTED
    retention_days: 1                 # Ephemeral
    auto_delete: true
    description: "Auth tokens expire and are deleted within 24 hours"

  audit_logs:
    classification: INTERNAL
    retention_days: 2555              # 7 years
    auto_delete: false
    tamper_protection: true
    description: "Audit logs retained for 7 years (compliance requirement)"

  api_keys:
    classification: RESTRICTED
    retention_days: 365
    rotation_required: true
    rotation_cycle_days: 90
    auto_delete: true
    description: "API keys rotated every 90 days, old keys deleted after 1 year"

  signing_certificates:
    classification: RESTRICTED
    retention_days: 730               # 2 years
    rotation_required: true
    rotation_cycle_days: 365
    auto_delete: false
    secure_deletion_required: true
    description: "Signing certificates retained for 2 years, rotated annually"

  # Application data
  application_logs:
    classification: INTERNAL
    retention_days: 90                # 3 months
    auto_delete: true
    review_before_delete: false
    description: "Application logs retained for 90 days"

  error_reports:
    classification: INTERNAL
    retention_days: 365
    auto_delete: true
    review_before_delete: false
    description: "Error reports retained for 1 year"

  installer_download_records:
    classification: INTERNAL
    retention_days: 365
    auto_delete: true
    description: "Installer download/update records retained for 1 year"

# ---------------------------------------------------------------------------
# Legal Hold Policy
# ---------------------------------------------------------------------------
legal_hold:
  enabled: true
  description: >
    When a legal hold is activated, all affected data is exempt from
    automatic deletion regardless of retention period. Legal holds
    override all retention policies and must be explicitly released.

  activation:
    authorized_roles: [admin]
    requires_justification: true
    notification_recipients:
      - security_team
      - legal_team
    audit_trail: required

  scope_options:
    - all_data                         # Organization-wide hold
    - by_classification                # Hold specific classification level
    - by_data_type                     # Hold specific data types
    - by_user                          # Hold specific user's data
    - by_vehicle                       # Hold specific vehicle's data
    - by_date_range                    # Hold data within a time window

  during_hold:
    auto_delete_suspended: true
    manual_delete_blocked: true
    modification_audit: strict
    data_export_restricted: true

  release:
    authorized_roles: [admin]
    requires_justification: true
    cooldown_period_days: 7
    notification_recipients:
      - security_team
      - legal_team
    audit_trail: required
    post_release_action: resume_normal_retention

# ---------------------------------------------------------------------------
# Backup Policy
# ---------------------------------------------------------------------------
backup:
  enabled: true
  description: >
    Backup schedules and retention for different data categories.
    All backups are encrypted at rest using AES-256-GCM.

  schedules:
    database_full:
      frequency: daily
      time_utc: "02:00"
      retention_days: 30
      encryption: AES-256-GCM
      storage: offsite_encrypted
      verification: weekly_restore_test

    database_incremental:
      frequency: every_6_hours
      retention_days: 7
      encryption: AES-256-GCM
      storage: offsite_encrypted

    file_storage:
      frequency: daily
      time_utc: "03:00"
      retention_days: 30
      encryption: AES-256-GCM
      storage: offsite_encrypted
      includes:
        - uploaded_documents
        - fuec_pdfs
        - preoperativa_photos

    audit_logs:
      frequency: daily
      time_utc: "01:00"
      retention_days: 2555            # 7 years (matches audit log retention)
      encryption: AES-256-GCM
      storage: offsite_encrypted
      tamper_protection: true

    configuration:
      frequency: on_change
      retention_days: 365
      encryption: AES-256-GCM
      storage: offsite_encrypted
      max_versions: 50

  disaster_recovery:
    rpo_hours: 6                       # Recovery Point Objective
    rto_hours: 4                       # Recovery Time Objective
    test_frequency: quarterly
    test_documentation: required
    offsite_location: different_region

# ---------------------------------------------------------------------------
# Secure Deletion Procedures
# ---------------------------------------------------------------------------
secure_deletion:
  description: >
    Procedures for securely deleting data that has exceeded its
    retention period or is subject to a deletion request.

  methods:
    database_records:
      method: crypto_erasure
      description: "Delete encryption keys rendering data unrecoverable"
      verification: required

    file_storage:
      method: overwrite_and_delete
      passes: 3
      description: "Overwrite with random data 3 times, then delete"
      verification: required

    local_cache:
      method: secure_wipe
      description: "Clear from OS keychain/credential store and wipe temp files"
      verification: required

    backups:
      method: scheduled_expiry
      description: "Backups auto-expire per backup retention schedule"
      note: "Cannot selectively delete from backups; rely on backup rotation"

  right_to_deletion:
    enabled: true
    legal_basis: "Ley 1581 de 2012, Article 8"
    max_response_days: 15
    process:
      - Verify requester identity
      - Check for legal hold conflicts
      - Identify all data locations (DB, files, backups, caches)
      - Execute secure deletion on primary storage
      - Document backup expiry timeline
      - Confirm deletion to requester
      - Log in audit trail
