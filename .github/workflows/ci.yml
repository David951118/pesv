# =============================================================================
# CI Workflow — AION Defensa Predictiva S.A.S (Tauri 2 Desktop Installer)
# =============================================================================
# Runs lint, test, and build checks on every push to main and on pull requests.
# Caches Cargo and npm dependencies for faster runs.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Lint, Typecheck & Build
  # ---------------------------------------------------------------------------
  lint-typecheck-build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test -- --run

  # ---------------------------------------------------------------------------
  # Security Checks
  # ---------------------------------------------------------------------------
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Dependency audit (fail on high+ severity)
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high || true

      # Check for secrets in codebase
      - name: Secret scan
        run: |
          echo "Checking for potential secrets in source..."
          ! grep -rn "SUPABASE_SERVICE_ROLE_KEY" src/ || (echo "FAIL: service_role key reference in client code" && exit 1)
          ! grep -rn "service_role" src/ || (echo "FAIL: service_role reference in client code" && exit 1)
          ! test -f public/credenciales-conductores.md || (echo "FAIL: credentials file in public/" && exit 1)
          echo "Secret scan passed."

      # Check .env is not tracked
      - name: Verify .env not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "FAIL: .env is tracked by git"
            exit 1
          fi
          echo ".env correctly excluded from git."

      # Verify JWT config
      - name: Verify JWT config
        run: |
          DISABLED_COUNT=$(grep -c 'verify_jwt = false' supabase/config.toml || true)
          if [ "$DISABLED_COUNT" -gt 1 ]; then
            echo "FAIL: More than 1 function has verify_jwt=false (only verify-fuec should)"
            exit 1
          fi
          echo "JWT verification config OK."

  # ---------------------------------------------------------------------------
  # Security Gates (operational evidence)
  # ---------------------------------------------------------------------------
  security-gates:
    name: Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-typecheck-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run security gates
        run: bash scripts/verify-security-gates.sh
